services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/omexlive?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - MEDIA_SERVICE_SECRET=${MEDIA_SERVICE_SECRET}
      - MEDIA_PUBLISH_AUTH_SECRET=${MEDIA_PUBLISH_AUTH_SECRET}
      - INGEST_SIGNATURE_TTL_SECONDS=${INGEST_SIGNATURE_TTL_SECONDS:-315360000}
      - AGENT_SERVICE_SECRET=${AGENT_SERVICE_SECRET}
      - AGENT_SERVICE_URL=${AGENT_SERVICE_URL:-http://agent-service:8001}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://localhost:5000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - RTMP_SERVER_URL=${RTMP_SERVER_URL:-rtmp://localhost:1935/live}
      # HLS playback URL returned to the frontend — point at the CDN in
      # front of your S3 bucket if media-service has S3_BUCKET configured,
      # otherwise point at the media-service's own host:port.
      - CDN_BASE_URL=${CDN_BASE_URL}
      - MEDIA_SERVICE_URL=${MEDIA_SERVICE_URL:-http://localhost:8080/live}
      - MEDIA_CONTROL_URL=http://media-service:8080
      - BREVO_SMTP_USER=${BREVO_SMTP_USER}
      - BREVO_SMTP_PASS=${BREVO_SMTP_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Split out from `backend` so a heavy ffmpeg transcode load never adds
  # latency to unrelated REST API requests, and so each can be scaled
  # independently (more API replicas vs. bigger/more media instances).
  media-service:
    build: ./media-service
    ports:
      - "1935:1935" # RTMP ingest (OBS / streaming software points here)
      - "8000:8000" # NodeMediaServer HTTP endpoint
      - "8080:8080" # health + local HLS playback
    environment:
      - MONGO_URI=mongodb://mongodb:27017/omexlive?replicaSet=rs0
      - BACKEND_INTERNAL_URL=http://backend:5000/api/v1
      - MEDIA_SERVICE_SECRET=${MEDIA_SERVICE_SECRET}
      - MEDIA_PUBLISH_AUTH_SECRET=${MEDIA_PUBLISH_AUTH_SECRET}
      - HLS_CLEANUP_DELAY_MS=${HLS_CLEANUP_DELAY_MS:-15000}
      - STREAM_AUTH_SWEEP_INTERVAL_MS=${STREAM_AUTH_SWEEP_INTERVAL_MS:-2000}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    volumes:
      - ./media-service/media:/app/media

  # Optional AI service. Start it with:
  #   docker compose --profile ai up -d agent-service
  # The main web stack remains usable without a Gemini API key.
  agent-service:
    profiles: ["ai"]
    build: ./agent-service
    ports:
      - "8001:8001"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_ADK_MODEL=${GOOGLE_ADK_MODEL:-gemini-flash-latest}
      - NODE_BACKEND_URL=http://backend:5000
      - AGENT_SERVICE_SECRET=${AGENT_SERVICE_SECRET}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - >-
        mongosh --host mongodb:27017 --quiet --eval
        'try { rs.status() } catch (error) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]})
        }'

  # Required for Socket.IO to work correctly once `backend` is scaled to
  # more than 1 replica (see backend/src/sockets/index.js and
  # presence.store.js). Harmless to run with a single backend replica too.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
