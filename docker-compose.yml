version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/omexlive
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      # HLS playback URL returned to the frontend — point at the CDN in
      # front of your S3 bucket if media-service has S3_BUCKET configured,
      # otherwise point at the media-service's own host:port.
      - CDN_BASE_URL=${CDN_BASE_URL}
      - MEDIA_SERVICE_URL=http://media-service:8000/live
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mongodb
      - redis

  # Split out from `backend` so a heavy ffmpeg transcode load never adds
  # latency to unrelated REST API requests, and so each can be scaled
  # independently (more API replicas vs. bigger/more media instances).
  media-service:
    build: ./media-service
    ports:
      - "1935:1935" # RTMP ingest (OBS / streaming software points here)
      - "8000:8000" # local HLS HTTP fallback (used when S3_BUCKET is unset)
      - "8080:8080" # health check
    environment:
      - MONGO_URI=mongodb://mongodb:27017/omexlive
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    depends_on:
      - mongodb
    volumes:
      - ./media-service/media:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
        - VITE_API_URL=${VITE_API_URL}
    ports:
      - "80:80"
    depends_on:
      - backend

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Required for Socket.IO to work correctly once `backend` is scaled to
  # more than 1 replica (see backend/src/sockets/index.js and
  # presence.store.js). Harmless to run with a single backend replica too.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
